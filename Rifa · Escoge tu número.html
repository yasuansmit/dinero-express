<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifa · Escoge tu número</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--mut:#6b7280;--card:#fff;--bd:#dfe3e8;--free:#d7f2df;--freefg:#14532d;--res:#fdecb0;--resfg:#713f12;--paid:#f8c9c9;--paidfg:#7f1d1d;--acc:#6d28d9;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#eceef1;--mut:#9aa3af;--card:#1e2126;--bd:#343a42;--free:#1d3d2a;--freefg:#b7ecc8;--res:#4a3b0e;--resfg:#fbe39a;--paid:#4a1f1f;--paidfg:#f6bcbc;--acc:#a78bfa;--accfg:#16102b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#eceef1;--mut:#9aa3af;--card:#1e2126;--bd:#343a42;--free:#1d3d2a;--freefg:#b7ecc8;--res:#4a3b0e;--resfg:#fbe39a;--paid:#4a1f1f;--paidfg:#f6bcbc;--acc:#a78bfa;--accfg:#16102b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}
.sub{color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:480px){#grid{grid-template-columns:repeat(10,1fr)}}
.n{border:2px solid transparent;border-radius:10px;padding:10px 0;font-size:1rem;font-weight:600;cursor:pointer;background:var(--free);color:var(--freefg)}
.n.res{background:var(--res);color:var(--resfg);cursor:not-allowed}
.n.paid{background:var(--paid);color:var(--paidfg);cursor:not-allowed;text-decoration:line-through}
.n.sel{border-color:var(--acc);background:var(--acc);color:var(--accfg)}
input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
button.p{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font:600 1rem system-ui;cursor:pointer}
button.p:disabled{opacity:.45;cursor:not-allowed}
button.s{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
.big{font-size:1.4rem;font-weight:700}
.msg{padding:10px;border-radius:10px;background:var(--res);color:var(--resfg);margin:10px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .card{max-width:420px;width:100%;margin:0}
a.p{display:block;text-align:center;text-decoration:none;box-sizing:border-box;padding:14px;border-radius:12px;background:var(--acc);color:var(--accfg);font-weight:600;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.ov{overflow-x:auto}
</style>
</head>
<body>
<main>
  <h1 id="t">Rifa</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="warn"></div>

  <div class="card">
    <div class="leg"><span><i style="background:var(--free)"></i>Libre</span><span><i style="background:var(--res)"></i>Reservado</span><span><i style="background:var(--paid)"></i>Pagado</span><span><i style="background:var(--acc)"></i>Tu selección</span></div>
    <div id="grid" style="margin-top:12px"></div>
  </div>

  <div class="card" id="buy">
    <div>Números: <b id="sl">ninguno</b></div>
    <div class="big" id="tot">$0</div>
    <input id="nm" placeholder="Tu nombre" autocomplete="name">
    <input id="ph" placeholder="Tu celular" inputmode="tel" autocomplete="tel">
    <button class="p" id="go" disabled>Reservar y pagar</button>
    <p class="sub" style="font-size:.85rem;margin:8px 0 0">La reserva dura 20 minutos. Si no pagas, el número vuelve a quedar libre.</p>
  </div>

  <div class="card" id="adm" style="display:none">
    <h2 style="margin:0 0 8px;font-size:1.1rem">Panel de la organizadora</h2>
    <div id="stats" class="sub"></div>
    <input id="cn" placeholder="Nombre de la rifa">
    <input id="cp" placeholder="Premio">
    <input id="cv" placeholder="Valor por número (ej. 10000)" inputmode="numeric">
    <input id="cq" placeholder="Tu número de Nequi (ej. 3001234567)" inputmode="tel">
    <button class="p" id="sv">Guardar configuración</button>
    <div class="ov" style="margin-top:12px"><table id="rows"></table></div>
  </div>
</main>

<div id="modal"><div class="card">
  <h2 style="margin:0">¡Números reservados!</h2>
  <p>Números: <b id="mn"></b></p>
  <p class="sub">Paga por Nequi al número:</p>
  <div class="big" id="mq"></div>
  <div class="big" id="mt"></div>
  <button class="s" id="cpy" style="margin:8px 0">Copiar número de Nequi</button>
  <a class="p" id="wa" target="_blank" rel="noopener">Ya pagué: enviar comprobante por WhatsApp</a>
  <button class="s" id="cl" style="width:100%;margin-top:8px">Cerrar</button>
</div></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var db=null,admin=false,cfg={name:"Rifa",price:10000,nequi:"",prize:""},nums={},sel={},EXP=20*60*1000,loaded=false;
var cop=function(v){return "$"+Number(v||0).toLocaleString("es-CO")};
function st(n){var d=nums[n];if(!d||!d.status)return"free";if(d.status==="paid")return"paid";if(d.status==="res"&&Date.now()-d.ts<EXP)return"res";return"free"}
function selList(){return Object.keys(sel).map(Number).sort(function(a,b){return a-b})}
function render(){
  $("#t").textContent=cfg.name||"Rifa";
  $("#sub").textContent=(cfg.prize?"Premio: "+cfg.prize+" · ":"")+cop(cfg.price)+" por número";
  var g=$("#grid");g.innerHTML="";
  for(var i=1;i<=100;i++){(function(n){
    var s=st(n);if(s!=="free")delete sel[n];
    var b=document.createElement("button");b.className="n "+(sel[n]?"sel":s);b.textContent=n;
    if(admin&&nums[n]&&nums[n].name)b.title=nums[n].name;
    b.onclick=function(){if(st(n)!=="free")return;if(sel[n])delete sel[n];else sel[n]=1;render()};
    g.appendChild(b)})(i)}
  var l=selList();
  $("#sl").textContent=l.length?l.join(", "):"ninguno";
  $("#tot").textContent=cop(l.length*cfg.price);
  $("#go").disabled=!l.length||!db;
  if(admin)renderAdmin();
}
function renderAdmin(){
  var c={free:0,res:0,paid:0};for(var i=1;i<=100;i++)c[st(i)]++;
  $("#stats").textContent="Libres: "+c.free+" · Reservados: "+c.res+" · Pagados: "+c.paid+" · Recaudado: "+cop(c.paid*cfg.price);
  var f=document.activeElement;
  var ids=["cn","cp","cv","cq"];
  if(!ids.some(function(x){return f&&f.id===x})&&!$("#cn").dataset.t){$("#cn").value=cfg.name||"";$("#cp").value=cfg.prize||"";$("#cv").value=cfg.price||"";$("#cq").value=cfg.nequi||"";}
  var h="<tr><th>N°</th><th>Nombre</th><th>Celular</th><th></th></tr>";
  for(var n=1;n<=100;n++){var s=st(n);if(s==="free")continue;var d=nums[n];
    h+="<tr><td>"+n+"</td><td>"+esc(d.name)+"</td><td>"+esc(d.phone)+"</td><td>"+(s==="res"?'<button class="s" data-a="paid" data-n="'+n+'">Pagado</button> ':"✓ ")+'<button class="s" data-a="del" data-n="'+n+'">Liberar</button></td></tr>'}
  $("#rows").innerHTML=h;
}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
$("#rows").addEventListener("click",function(e){
  var a=e.target.dataset&&e.target.dataset.a;if(!a)return;var ref=db.doc("nums/"+e.target.dataset.n);
  (a==="paid"?ref.update({status:"paid"}):ref.delete()).catch(function(){alert("No se pudo actualizar.")});
});
["cn","cp","cv","cq"].forEach(function(x){$("#"+x).addEventListener("input",function(){$("#cn").dataset.t=1})});
$("#sv").onclick=function(){
  var v={name:$("#cn").value.trim()||"Rifa",prize:$("#cp").value.trim(),price:parseInt($("#cv").value,10)||0,nequi:$("#cq").value.replace(/\D/g,"")};
  db.doc("raffle/config").set(v).then(function(){delete $("#cn").dataset.t;alert("Guardado ✓")}).catch(function(){alert("No se pudo guardar.")});
};
$("#go").onclick=async function(){
  var name=$("#nm").value.trim(),phone=$("#ph").value.replace(/\D/g,"");
  if(!name||phone.length<7){alert("Escribe tu nombre y tu celular.");return}
  if(!cfg.nequi){alert("La organizadora aún no ha configurado el Nequi.");return}
  var btn=this;btn.disabled=true;btn.textContent="Reservando…";
  var ok=[],bad=[];
  try{
    for(var n of selList()){
      var ref=db.doc("nums/"+n),l=await ref.acquire({holder:phone,ttlMs:8000});
      if(!l.acquired){bad.push(n);continue}
      var s=await ref.get(),d=s.exists?s.data():null;
      if(d&&d.status&&(d.status==="paid"||(d.status==="res"&&Date.now()-d.ts<EXP))){bad.push(n);continue}
      await ref.set({status:"res",name:name,phone:phone,ts:Date.now()});ok.push(n);delete sel[n];
    }
  }catch(e){alert("Hubo un problema al reservar. Intenta de nuevo.")}
  btn.textContent="Reservar y pagar";render();
  if(bad.length)alert("Estos números ya los tomó otra persona: "+bad.join(", "));
  if(ok.length){
    var tot=cop(ok.length*cfg.price);
    $("#mn").textContent=ok.join(", ");$("#mq").textContent="Nequi "+cfg.nequi;$("#mt").textContent="Total: "+tot;
    var msg="Hola, soy "+name+". Reservé los números "+ok.join(", ")+" y pagué "+tot+" por Nequi.";
    $("#wa").href="https://wa.me/57"+cfg.nequi+"?text="+encodeURIComponent(msg);
    $("#modal").style.display="flex";
  }
};
$("#cpy").onclick=function(){try{navigator.clipboard.writeText(cfg.nequi);this.textContent="Copiado ✓"}catch(e){}};
$("#cl").onclick=function(){$("#modal").style.display="none"};
render();
var timer=setTimeout(function(){if(!loaded)$("#warn").innerHTML='<div class="msg">No se pudo conectar todavía. Puede que los números no estén al día.</div>'},10000);
if(window.claude&&claude.use){
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    db=r[0];var u=r[1];admin=!!(u&&u.canEdit&&u.canEdit());
    if(!db){clearTimeout(timer);$("#warn").innerHTML='<div class="msg">Inicia sesión en Claude para ver y escoger los números.</div>';return}
    $("#adm").style.display=admin?"block":"none";
    db.doc("raffle/config").onSnapshot(function(s){if(s.exists)cfg=Object.assign(cfg,s.data());render()},function(){});
    db.collection("nums").onSnapshot(function(s){loaded=true;clearTimeout(timer);$("#warn").innerHTML="";nums={};s.docs.forEach(function(d){nums[d.id]=d.data()});render()},function(){clearTimeout(timer);$("#warn").innerHTML='<div class="msg">No se pudieron cargar los números.</div>'});
  });
}
setInterval(render,60000);
})();
</script>
</body>
</html>
